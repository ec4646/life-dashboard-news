name: Update prices

on:
  schedule:
    # Every hour at quarter past, 07:15 to 21:15 UTC, Monday to Friday
    # (London market hours, plus the New York session for any US holdings)
    - cron: '15 7-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch prices
        run: node fetch-prices.mjs
      - name: Commit prices.json
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet && exit 0
          git commit -m "Update prices"
          git pull --rebase
          git push
