name: Update news

on:
  schedule:
    # 05:30, 11:30 and 16:30 UTC every day
    - cron: '30 5,11,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Shared with the prices job so two jobs never push at the same moment.
concurrency:
  group: commit-main

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch headlines
        run: node fetch-news.mjs
      - name: Commit news.json
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet && exit 0
          git commit -m "Update news"
          # GitHub occasionally refuses a pull or push for a moment. Try up to three times.
          for try in 1 2 3; do
            git pull --rebase && git push && exit 0
            echo "Could not save (try $try of 3), trying again in 20 seconds"
            sleep 20
          done
          exit 1
