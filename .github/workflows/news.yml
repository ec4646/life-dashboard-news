name: Update news

on:
  schedule:
    # 05:30, 11:30 and 16:30 UTC every day
    - cron: '30 5,11,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch headlines
        run: node fetch-news.mjs
      - name: Commit news.json
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Update news"
          git push
